        - paragraph [ref=e40]: "I developed a telemetry system for my 2022 Ram ProMaster. Investigating CAN bus signals and building a Python data broker gave me the data to show live readings and trends in a tablet web app: gauges, parked battery status, trip history, and an evidence-based warning system."
        - paragraph [ref=e41]:
          - text: "The same CAN work produced one guarded control action: from the dashboard, the doors can be locked or unlocked"
