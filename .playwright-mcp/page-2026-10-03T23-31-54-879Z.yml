      - generic [ref=f1e55]:
        - generic [ref=f1e56]:
          - generic [ref=f1e57]: "01"
          - generic [ref=f1e58]:
            - heading "An interface to physical systems" [level=2] [ref=f1e59]
            - paragraph [ref=f1e60]: "The dashboard brings together systems with very different behavior: a light responds quickly, a backup can run for hours, and switching a network connection can interrupt the request that initiated it. The interface needs to account for those differences."
            - paragraph [ref=f1e61]: The React and TypeScript frontend groups the controls by system, and a Python/Flask backend owns the device and service controllers. The browser is a client of that backend and keeps no copy of the device state.
        - generic [ref=f1e62]:
          - generic [ref=f1e63]: "02"
          - generic [ref=f1e64]:
            - heading "Working with imperfect connections" [level=2] [ref=f1e65]
            - paragraph [ref=f1e66]: Polling runs one request at a time, so slow responses cannot pile up, and it pauses while the page is hidden. If a refresh fails, the interface keeps showing the last valid data.
            - paragraph [ref=f1e67]: Control failures need different handling from read failures. A timeout does not prove that a device ignored a command, so after a failed action the interface asks the backend for the current state instead of retrying a command that may already have taken effect.
        - generic [ref=f1e68]:
          - generic [ref=f1e69]: "03"
          - generic [ref=f1e70]:
            - heading "The systems behind the screen" [level=2] [ref=f1e71]
            - paragraph [ref=f1e72]: "The dashboard sits on top of systems I operate every day: automated backups; cellular, satellite, and directional Wi-Fi connectivity; and storage protection that responds to the vehicle's ignition state."
            - paragraph [ref=f1e73]: The demo below reproduces a few of those control patterns with simulated data.
