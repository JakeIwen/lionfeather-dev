          - text: PERSONAL PROJECT
          - generic [ref=f1e38]: / Ongoing
        - heading "A dashboard for a home on wheels." [level=1] [ref=f1e39]
        - paragraph [ref=f1e40]: I live in a converted campervan. Its network, storage, backups, lighting, and media services are connected through a Raspberry Pi and an OpenWrt router. I built a browser dashboard to see what is happening and control those systems from one place.
      - generic [ref=f1e41]:
        - generic [ref=f1e42]:
